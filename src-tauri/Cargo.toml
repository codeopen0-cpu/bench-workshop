[package]
name = "bench-workshop"
version = "0.16.0"
description = "Bench Workshop: build, wire, program and test boards and machines in 3D"
edition = "2021"
license = "MIT"
repository = "https://github.com/codeopen0-cpu/bench-workshop"

[lib]
name = "bench_workshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
