; The RP2040 board's demo program (Bench Workshop ships its .uf2 in public/firmware).
; Build: pio run, then copy .pio/build/demo/firmware.uf2 to ../../public/firmware/rp2040-demo.uf2
[env:demo]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
